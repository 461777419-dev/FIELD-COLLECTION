<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图集 · 搜索栏</title>
  <style>
    :root { font-family:"Songti SC","SimSun","Microsoft YaHei",serif; color:#3c2a1c; background:#f3e5c8; }
    * { box-sizing:border-box; }
    body { margin:0; }
    .search-header { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:54px; padding:9px 15px; border:1px solid #ab9b7b; background:#f3e7cc; }
    .breadcrumb { display:flex; align-items:center; gap:12px; white-space:nowrap; font-size:13px; }
    .breadcrumb strong { font-weight:700; }
    .breadcrumb svg { width:12px; height:12px; }
    .header-actions { display:flex; align-items:center; gap:12px; min-width:0; }
    .search { display:flex; align-items:center; gap:8px; width:min(340px,45vw); height:34px; padding:0 10px; border:1px solid #ab9b7b; border-radius:3px; background:#fffbf0; color:#423323; }
    .search:focus-within { border-color:#42634b; background:#f4e2bb; box-shadow:0 0 0 2px #72907555; }
    .search svg { width:16px; height:16px; flex:none; color:#617d92; }
    .search input { width:100%; min-width:0; border:0; outline:0; background:transparent; color:#3c2a1c; font-family:inherit; font-size:13px; }
    .search input::placeholder { color:#898578; }
    .search kbd { white-space:nowrap; color:#69503a; font-size:10px; font-family:inherit; }
    .panel-button { display:grid; place-items:center; width:32px; height:32px; padding:0; border:1px solid #ab9b7b; background:#f3e7cc; color:#617d92; cursor:pointer; }
    .panel-button svg { width:17px; height:17px; }
    button:focus-visible { outline:2px solid #42634b; outline-offset:2px; }
    .status { margin:12px 15px; font-size:12px; color:#637366; }
    [hidden] { display:none!important; }
    @media(max-width:520px) {
      .search-header { flex-wrap:wrap; gap:10px; padding:10px 12px; }
      .header-actions { width:100%; }
      .search { width:auto; flex:1; }
    }
  </style>
</head>
<body>
  <header class="search-header">
    <nav class="breadcrumb" aria-label="当前位置">
      <span>我的图库</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      <strong>所有图片</strong>
    </nav>
    <div class="header-actions">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="searchInput" type="search" placeholder="搜索图片、标签或备注" autocomplete="off" aria-label="搜索图片">
        <kbd>Ctrl K</kbd>
      </label>
      <button class="panel-button" id="toggleDetails" type="button" title="显示或隐藏详情" aria-label="显示或隐藏详情" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M15 3v18"/></svg>
      </button>
    </div>
  </header>
  <p class="status" id="searchStatus" role="status" hidden></p>
  <script>
    // 接入图库时，监听 library-search 事件并使用 event.detail.query 过滤图片。
    const input = document.getElementById('searchInput');
    const status = document.getElementById('searchStatus');
    input.addEventListener('input', () => {
      const query = input.value.trim();
      status.hidden = !query;
      status.textContent = query ? `搜索词：${query}` : '';
      document.dispatchEvent(new CustomEvent('library-search', { detail: { query } }));
    });
    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        input.focus();
      }
    });
    document.getElementById('toggleDetails').addEventListener('click', event => {
      const button = event.currentTarget;
      const open = button.getAttribute('aria-pressed') !== 'true';
      button.setAttribute('aria-pressed', String(open));
      document.dispatchEvent(new CustomEvent('library-toggle-details', { detail: { open } }));
    });
  </script>
</body>
</html>
